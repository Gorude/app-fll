<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09202c"/>
      <stop offset="50%" stop-color="#0d3b4c"/>
      <stop offset="100%" stop-color="#061822"/>
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.6"/>
  
  <!-- Subtle radar circles in background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Compass / Crosshair accents -->
  <line x1="256" y1="40" x2="256" y2="70" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="442" x2="256" y2="472" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="70" y2="256" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="442" y1="256" x2="472" y2="256" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Water Waves -->
  <path d="M 80 340 Q 140 310 200 340 T 320 340 T 432 340" fill="none" stroke="url(#waveGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 110 380 Q 170 355 230 380 T 350 380 T 410 380" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Main Fish Emblem (Pantanal Dourado / Fish silhouette) -->
  <g filter="url(#glow)">
    <!-- Body -->
    <path d="M 130 250 C 130 180 200 160 300 190 C 370 210 400 240 400 240 C 400 240 360 270 290 285 C 200 305 130 280 130 250 Z" fill="url(#fishGrad)"/>
    <!-- Tail -->
    <path d="M 140 250 L 80 190 C 95 240 95 260 80 310 Z" fill="url(#fishGrad)"/>
    <!-- Dorsal fin -->
    <path d="M 230 180 Q 270 130 310 170 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Ventral fin -->
    <path d="M 240 280 Q 270 320 290 285 Z" fill="#10b981" opacity="0.8"/>
    <!-- Eye -->
    <circle cx="360" cy="225" r="7" fill="#0f172a"/>
    <circle cx="362" cy="223" r="2.5" fill="#ffffff"/>
    <!-- Lateral line -->
    <path d="M 160 252 Q 260 255 350 242" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Fishing Hook / GPS pin accent -->
  <path d="M 330 130 C 350 130 370 145 370 165 C 370 185 350 200 335 200" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="330" cy="130" r="5" fill="#e2e8f0"/>

  <!-- Text "MS" Badge -->
  <rect x="216" y="405" width="80" height="32" rx="16" fill="#10b981"/>
  <text x="256" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#09131b" text-anchor="middle" letter-spacing="2">PESCA MS</text>
</svg>
